version: '2'
services:
  postgres:
    image: postgres:13.4-alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres2
    ports:
      - 5444:5432
    volumes:
      - /Users/chris/postgres-docker:/var/lib/postgresql/data
      - /tmp:/tmp
  adminer:
    image: adminer
    restart: always
